<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BEIJING 2026</title>

  <meta name="theme-color" content="#d71920" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BEIJING 2026" />

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />

  <style>
    html,body,#appframe{width:100%;height:100%;margin:0;padding:0;border:0;background:#faf9f5}
    body{overflow:hidden}
    #appframe{display:block}
  </style>
</head>
<body>
  <iframe
    id="appframe"
    src="./app.html"
    title="BEIJING 2026"
    allow="geolocation; clipboard-read; clipboard-write; fullscreen"
  ></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
