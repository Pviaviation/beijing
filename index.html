<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BEIJING 2026</title>
  <meta name="theme-color" content="#d71920" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BEIJING 2026" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
  <style>
    html,body,#appframe{width:100%;height:100%;margin:0;padding:0;border:0;background:#faf9f5}
    body{overflow:hidden}
    #appframe{display:block}
    #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      z-index:2;font:600 14px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;
      color:#7a3034;background:#fff7ef}
  </style>
</head>
<body>
  <div id="boot">Đang mở BEIJING 2026…</div>
  <iframe id="appframe" title="BEIJING 2026"
    allow="geolocation; clipboard-read; clipboard-write; fullscreen"></iframe>

  <script>
    // The existing app checks for a GitHub token before enabling shared write.
    // This is only a local compatibility flag; the service worker redirects
    // those sync calls to Supabase, so no real GitHub token is used.
    try { localStorage.setItem('bj_gh_token', 'supabase-bridge'); } catch (e) {}

    async function boot() {
      const frame = document.getElementById('appframe');
      const splash = document.getElementById('boot');

      try {
        if ('serviceWorker' in navigator) {
          const reg = await navigator.serviceWorker.register('./service-worker.js');
          await navigator.serviceWorker.ready;

          // If a newly installed worker is waiting, activate it immediately.
          if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });

          // On the very first install this page may not yet be controlled.
          // One reload makes the service-worker bridge active before app.html loads.
          if (!navigator.serviceWorker.controller) {
            sessionStorage.setItem('bj_sw_boot', '1');
            location.reload();
            return;
          }
        }

        frame.addEventListener('load', () => {
          splash.style.display = 'none';
        }, { once: true });

        // Normal URL load, not srcdoc: robust for the 16+ MB standalone bundle.
        frame.src = './app.html?v=4';
      } catch (e) {
        console.error(e);
        splash.textContent = 'Không mở được app. Hãy refresh trang.';
      }
    }

    window.addEventListener('load', boot);
  </script>
</body>
</html>
