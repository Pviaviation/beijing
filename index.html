<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BEIJING 2026</title>
  <meta name="theme-color" content="#d71920" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BEIJING 2026" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
  <style>
    html,body,#appframe{width:100%;height:100%;margin:0;padding:0;border:0;background:#faf9f5}
    body{overflow:hidden}
    #appframe{display:block}
    #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      z-index:2;font:600 14px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;
      color:#7a3034;background:#fff7ef}
  </style>
</head>
<body>
  <div id="boot">Đang mở BEIJING 2026…</div>
  <iframe id="appframe" title="BEIJING 2026"
    allow="geolocation; clipboard-read; clipboard-write; fullscreen"></iframe>

  <script>
    // The existing app checks for a GitHub token before enabling shared write.
    // This is only a local compatibility flag; the service worker redirects
    // those sync calls to Supabase, so no real GitHub token is used.
    try { localStorage.setItem('bj_gh_token', 'supabase-bridge'); } catch (e) {}

    function patchLegacySyncUI(frame) {
      try {
        const doc = frame.contentDocument;
        if (!doc || !doc.body) return;

        const patch = () => {
          const all = Array.from(doc.querySelectorAll('*'));

          // Find the old heading and its surrounding sync card.
          const heading = all.find(el =>
            el.children.length === 0 &&
            (el.textContent || '').trim() === 'Đồng bộ nhóm qua GitHub'
          );

          if (!heading) return false;

          heading.textContent = 'Đồng bộ nhóm · Supabase';

          // Walk upward until we find a container that also contains the token input/buttons.
          let card = heading.parentElement;
          for (let i = 0; i < 6 && card; i++, card = card.parentElement) {
            const txt = card.textContent || '';
            if (txt.includes('github_pat_') || txt.includes('Lưu & đồng bộ') || txt.includes('Tải lại từ nhóm')) break;
          }

          if (!card) return true;

          // Remove legacy explanatory text mentioning GitHub/token.
          Array.from(card.querySelectorAll('*')).forEach(el => {
            const t = (el.textContent || '').trim();
            if (
              t.includes('Dán token GitHub') ||
              t.includes('github_pat_') ||
              t === 'Lưu & đồng bộ' ||
              t === 'Tải lại từ nhóm'
            ) {
              if (el.tagName === 'INPUT' || el.tagName === 'BUTTON') {
                el.style.display = 'none';
              } else if (!el.children.length) {
                el.style.display = 'none';
              }
            }
          });

          // Hide text inputs in this legacy sync card.
          card.querySelectorAll('input').forEach(inp => {
            const ph = inp.getAttribute('placeholder') || '';
            if (ph.includes('github_pat') || inp.type === 'password' || inp.type === 'text') {
              inp.style.display = 'none';
            }
          });

          // Hide the two legacy GitHub buttons.
          card.querySelectorAll('button').forEach(btn => {
            const t = (btn.textContent || '').trim();
            if (t === 'Lưu & đồng bộ' || t === 'Tải lại từ nhóm') btn.style.display = 'none';
          });

          // Add a clear Supabase status note once.
          if (!card.querySelector('[data-supabase-shell-note]')) {
            const note = doc.createElement('div');
            note.setAttribute('data-supabase-shell-note', '1');
            note.textContent = '☁️ Tự động đồng bộ cho cả nhóm qua Supabase · không cần token';
            note.style.cssText =
              'margin-top:8px;padding:10px 12px;border-radius:12px;background:#e9f8f3;' +
              'color:#0f6b60;font-size:12px;line-height:1.45;font-weight:600;';
            card.appendChild(note);
          }

          return true;
        };

        if (patch()) return;

        // The app renders asynchronously after unpacking, so watch until the UI appears.
        const mo = new MutationObserver(() => {
          if (patch()) {
            // Keep observer a little longer in case React re-renders the block.
            setTimeout(() => mo.disconnect(), 3000);
          }
        });
        mo.observe(doc.documentElement, { childList: true, subtree: true });

        setTimeout(() => {
          try { patch(); } catch (_) {}
        }, 1200);
      } catch (e) {
        console.warn('[BEIJING] UI patch skipped:', e);
      }
    }

    async function boot() {
      const frame = document.getElementById('appframe');
      const splash = document.getElementById('boot');

      try {
        if ('serviceWorker' in navigator) {
          const reg = await navigator.serviceWorker.register('./service-worker.js');
          await navigator.serviceWorker.ready;

          if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });

          if (!navigator.serviceWorker.controller) {
            sessionStorage.setItem('bj_sw_boot', '1');
            location.reload();
            return;
          }
        }

        frame.addEventListener('load', () => {
          splash.style.display = 'none';
          patchLegacySyncUI(frame);
        }, { once: true });

        frame.src = './app.html?v=5';
      } catch (e) {
        console.error(e);
        splash.textContent = 'Không mở được app. Hãy refresh trang.';
      }
    }

    window.addEventListener('load', boot);
  </script>
</body>
</html>
